name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing vX.Y.Z tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checkout-ref: ${{ steps.release.outputs.checkout-ref }}
      release-channel: ${{ steps.release.outputs.release-channel }}
      release-environment: ${{ steps.release.outputs.release-environment }}
      workload-image: ${{ steps.release.outputs.workload-image }}
      compatibility-override: ${{ steps.release.outputs.compatibility-override }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release source
        id: release
        env:
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.release-tag }}
        run: |
          compatibility_override=false
          if [[ -n "$INPUT_TAG" || "$EVENT_REF_TYPE" == tag ]]; then
            checkout_ref=${INPUT_TAG:-$EVENT_TAG}
            if ! [[ "$checkout_ref" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must be strict vX.Y.Z" >&2
              exit 1
            fi
            git fetch --force origin "refs/tags/$checkout_ref:refs/tags/$checkout_ref"
            git merge-base --is-ancestor "$checkout_ref" origin/main
            release_channel=latest/stable
            release_environment=stable
          else
            checkout_ref=$SOURCE_SHA
            release_channel=latest/edge
            release_environment=edge
          fi
          workload_image=$(git show "$checkout_ref:charmcraft.yaml" | sed -n 's/^[[:space:]]*upstream-source:[[:space:]]*//p')
          test -n "$workload_image"
          if [[ "$checkout_ref" == v1.0.0 && "$workload_image" == reduct/store:latest ]]; then
            workload_image=reduct/store:v1.20.11
            compatibility_override=true
          elif [[ "$release_channel" == latest/stable && "$workload_image" == *:latest ]]; then
            echo "Stable releases cannot use a floating latest image" >&2
            exit 1
          fi
          printf 'checkout-ref=%s\nrelease-channel=%s\nrelease-environment=%s\nworkload-image=%s\ncompatibility-override=%s\n' "$checkout_ref" "$release_channel" "$release_environment" "$workload_image" "$compatibility_override" >> "$GITHUB_OUTPUT"
          printf "## Release inputs\n\n- Source: \`%s\`\n- Channel: \`%s\`\n- Workload image: \`%s\`\n- Compatibility override: \`%s\`\n" "$checkout_ref" "$release_channel" "$workload_image" "$compatibility_override" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yaml
    with:
      checkout-ref: ${{ needs.prepare.outputs.checkout-ref }}

  integration:
    needs: prepare
    uses: ./.github/workflows/integration.yaml
    with:
      checkout-ref: ${{ needs.prepare.outputs.checkout-ref }}
      workload-image: ${{ needs.prepare.outputs.compatibility-override == 'true' && needs.prepare.outputs.workload-image || '' }}

  build:
    needs: [prepare, checks, integration]
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.checkout-ref }}
          persist-credentials: false
      - name: Install Charmcraft
        run: sudo snap install charmcraft --channel latest/stable --classic
      - name: Apply v1.0.0 compatibility override
        if: needs.prepare.outputs.compatibility-override == 'true'
        env:
          WORKLOAD_IMAGE: ${{ needs.prepare.outputs.workload-image }}
        run: perl -0pi -e "s|reduct/store:latest|$ENV{WORKLOAD_IMAGE}|" charmcraft.yaml
      - name: Build charm
        run: charmcraft pack --destructive-mode --platform=${{ matrix.architecture }}
      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reductstore-charm-${{ matrix.architecture }}
          path: '*_${{ matrix.architecture }}.charm'
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.release-environment }}
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.checkout-ref }}
          persist-credentials: false
      - name: Download charm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reductstore-charm-*
          path: artifacts
          merge-multiple: true
      - name: Install Charmcraft
        run: sudo snap install charmcraft --channel latest/stable --classic
      - name: Publish both architectures
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          WORKLOAD_IMAGE: ${{ needs.prepare.outputs.workload-image }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.release-channel }}
        run: |
          shopt -s nullglob
          for architecture in amd64 arm64; do
            docker pull --platform="linux/$architecture" "$WORKLOAD_IMAGE"
            image_id=$(docker image inspect --format='{{.Id}}' "$WORKLOAD_IMAGE")
            resource_output=$(charmcraft upload-resource reductstore-k8s reductstore-image --image="$image_id" --format json)
            resource_revision=$(printf '%s' "$resource_output" | jq -r '.revision')
            charm_files=(artifacts/*_"$architecture".charm)
            test "${#charm_files[@]}" -eq 1
            charm_output=$(charmcraft upload "${charm_files[0]}" --format json)
            charm_revision=$(printf '%s' "$charm_output" | jq -r '.revision')
            charmcraft release reductstore-k8s --revision="$charm_revision" --channel="$RELEASE_CHANNEL" --resource="reductstore-image:$resource_revision"
            printf -- "- %s: charm \`%s\`, resource \`%s\`\n" "$architecture" "$charm_revision" "$resource_revision" >> "$GITHUB_STEP_SUMMARY"
          done
